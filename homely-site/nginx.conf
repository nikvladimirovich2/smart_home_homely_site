# ============================================================
#  HOMELY — пример конфигурации Nginx
#  Скопируйте этот блок в /etc/nginx/sites-available/homely
#  и создайте символическую ссылку в sites-enabled, либо
#  вставьте содержимое server{} в свой существующий конфиг.
# ============================================================

server {
    listen 80;

    # Замените на свой домен, или используйте IP сервера / "_" для тестовой среды
    server_name homely.example www.homely.example;

    root /var/www/html;
    index index.html;

    # ---------- Основная маршрутизация ----------
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Красивые URL без .html (необязательно, можно убрать)
    location ~ ^/(services|pricing|automations|portfolio|contacts|faq)$ {
        try_files /$1.html =404;
    }

    # ---------- Кастомная страница 404 ----------
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ---------- Кэширование статики ----------
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # HTML не кэшируем агрессивно, чтобы изменения в config.js/HTML сразу отражались
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # ---------- Сжатие ----------
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 512;

    # ---------- Базовые заголовки безопасности ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # robots.txt / sitemap.xml отдаются как обычные файлы из корня
    location = /robots.txt  { access_log off; log_not_found off; }
    location = /sitemap.xml { access_log off; log_not_found off; }

    client_max_body_size 5M;
}

# Тестовая среда: только HTTP (порт 80), без IPv6 и без TLS.
# Когда сайт будет готов к продакшену — добавьте HTTPS через certbot
# (sudo certbot --nginx -d homely.example), он сам допишет нужные блоки.
